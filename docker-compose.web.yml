# Movistar Nube WebDAV: usa Movistar Cloud como la web oficial, con un Chromium sin
# pantalla, y lo sirve por WebDAV.
#
#   docker compose -f docker-compose.web.yml up -d
#
# Después, abre el panel (puerto 5000) y pulsa «Abrir inicio de sesión».
# Para compilar la imagen en local en vez de descargarla:
#   docker build -f Dockerfile.web -t ghcr.io/neoalarrode/movistar-nube-webdav:latest .
services:
  movistar-nube-webdav:
    image: ghcr.io/neoalarrode/movistar-nube-webdav:latest
    container_name: movistar-nube-webdav
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m      # en RAM: con tope (sin él, Docker deja la mitad de la memoria)
    shm_size: 256m          # Chromium usa /dev/shm
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ:-Europe/Madrid}
      - WEBDAV_USER=${WEBDAV_USER:-}
      - WEBDAV_PASSWORD=${WEBDAV_PASSWORD:-}
      - WEBUI_USER=${WEBUI_USER:-}
      - WEBUI_PASSWORD=${WEBUI_PASSWORD:-}
      - WEBDAV_HOST_PORT=${WEBDAV_PORT:-5050}
      # Notificaciones de Telegram (activas desde el arranque; opcional):
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      # Opcional (valores por defecto entre paréntesis):
      # - TOKENS_ENCRYPTION_KEY=${TOKENS_ENCRYPTION_KEY:-}  # Cifra secretos en /app/tokens con AES-256-GCM
      # - WEBDAV_MAX_DOWNLOADS=4          # Descargas simultáneas (4 en modo web)
      # - WEBDAV_MAX_UPLOADS=2            # Subidas simultáneas (2, como la web)
      # - WEB_SESSION_RENEW_BEFORE=1h     # Renueva la sesión de 24 h este margen antes (requiere "No cerrar sesión")
      # - WEB_TRASH_EMPTY_EVERY=6h        # Vacía la papelera cada X (desactivado)
    ports:
      - "${BIND_IP:-0.0.0.0}:${WEB_PORT:-5000}:5000"
      - "${BIND_IP:-0.0.0.0}:${WEBDAV_PORT:-5050}:8080"
    volumes:
      - movistar_nube_tokens:/app/tokens   # incluye el perfil de Chromium (la sesión)

volumes:
  movistar_nube_tokens:
    name: movistar_nube_webdav_tokens
